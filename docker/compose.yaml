name: mediaflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediaflow
      POSTGRES_USER: mediaflow
      POSTGRES_PASSWORD: mediaflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaflow -d mediaflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediaflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mediaflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: mediaflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing local/mediaflow-source;
      /usr/bin/mc mb --ignore-existing local/mediaflow-processed;
      /usr/bin/mc mb --ignore-existing local/mediaflow-delivery;
      echo 'Buckets created successfully.';
      "

  api:
    image: node:22-alpine
    container_name: mediaflow-api
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://mediaflow:mediaflow_dev_password@postgres:5432/mediaflow
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MEDIAFLOW_DEMO_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: node:22-alpine
    container_name: mediaflow-worker
    working_dir: /app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://mediaflow:mediaflow_dev_password@postgres:5432/mediaflow
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MEDIA_WORKER_CONCURRENCY: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    container_name: mediaflow-web
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
