name: MediaFlow CI & Code Quality Evaluator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-no-rhinoq:
    name: 🛡️ Verify No-RhinoQ Policy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run No-RhinoQ Verification Gate
        run: node scripts/verify-no-rhinoq.mjs

  build-and-typecheck:
    name: ⚙️ TypeScript Build & Type Check
    runs-on: ubuntu-latest
    needs: verify-no-rhinoq
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run TypeScript Monorepo Build
        run: pnpm build

  code-evaluation-scorecard:
    name: 🏆 AI Code Evaluation & Scorecard
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run AI Code Quality Evaluator Scorecard
        run: node evals/scorecards/eval_code_quality.mjs
